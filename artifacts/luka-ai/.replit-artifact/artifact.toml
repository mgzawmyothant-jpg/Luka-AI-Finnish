kind = "web"
previewPath = "/"
title = "Luka AI - Finnish Master"
version = "1.0.0"
id = "artifacts/luka-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22330
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/luka-ai run dev"

[services.env]
PORT = "22330"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/luka-ai", "run", "build"]
publicDir = "artifacts/luka-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
